<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>Stargazers log</h1>
        <p>A log of the repositories I've starred.</p>
      </header>
      <section aria-labelledby="stars-heading">
        <h2 id="stars-heading">Starred repositories</h2>
        <p id="status" role="status">Loading repositories…</p>
        <ul id="repository-list" class="repository-list" aria-live="polite"></ul>
      </section>
    </main>
  </body>
</html>
